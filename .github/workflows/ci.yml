name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: CI / quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: tablekeep-ci-secret-at-least-thirty-two-characters
      GOOGLE_CLIENT_ID: tablekeep-ci-client
      GOOGLE_CLIENT_SECRET: tablekeep-ci-client-secret
      RESEND_API_KEY: tablekeep-ci-resend-key
      FROM_EMAIL: noreply@tablekeep.test
      UPLOADTHING_TOKEN: tablekeep-ci-uploadthing-token
      DATABASE_URL: postgresql://tablekeep:tablekeep@127.0.0.1:5432/tablekeep_test
      DATA_SOURCE: http://127.0.0.1:4100
      LOG_LEVEL: warn
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/apps/web/.next/cache
            ${{ github.workspace }}/apps/docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.js', 'apps/web/**/*.jsx', 'apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/docs/**/*.js', 'apps/docs/**/*.jsx', 'apps/docs/**/*.ts', 'apps/docs/**/*.tsx', 'apps/docs/**/*.mdx', 'packages/ui/**/*.ts', 'packages/ui/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check formatting and lint
        run: pnpm check:ci

      - name: Check types
        run: pnpm check-types

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build applications
        run: pnpm build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: CI / browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Chromium and its Linux dependencies are preinstalled in this image. Keep
    # the tag synchronized with @playwright/test in the root package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tablekeep
          POSTGRES_PASSWORD: tablekeep
          POSTGRES_DB: tablekeep_test
        options: >-
          --health-cmd "pg_isready -U tablekeep -d tablekeep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASE_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: tablekeep-browser-secret-at-least-thirty-two-characters
      GOOGLE_CLIENT_ID: tablekeep-browser-client
      GOOGLE_CLIENT_SECRET: tablekeep-browser-client-secret
      RESEND_API_KEY: tablekeep-browser-resend-key
      FROM_EMAIL: noreply@tablekeep.test
      UPLOADTHING_TOKEN: tablekeep-browser-uploadthing-token
      # Job containers reach service containers by their service label.
      DATABASE_URL: postgresql://tablekeep:tablekeep@postgres:5432/tablekeep_test
      DATA_SOURCE: http://127.0.0.1:4100
      LOG_LEVEL: warn
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable database
        run: pnpm --filter web exec drizzle-kit push --force

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
