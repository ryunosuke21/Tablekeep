<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Implementation Plan</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --surface-alt: #f0f3f8;
        --text: #172033;
        --muted: #5e687a;
        --border: #d9deea;
        --accent: #5b5bd6;
        --accent-soft: #e9e9ff;
        --success: #16825d;
        --success-soft: #e1f5ec;
        --warning: #a15c00;
        --warning-soft: #fff0d5;
        --code-bg: #111827;
        --code-text: #e5e7eb;
        --shadow: 0 10px 30px rgb(23 32 51 / 8%);
        --radius: 14px;
        --content-width: 960px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d111b;
          --surface: #151b27;
          --surface-alt: #1c2432;
          --text: #e7eaf0;
          --muted: #a9b1c1;
          --border: #30394a;
          --accent: #a5a5ff;
          --accent-soft: #292951;
          --success: #71d5ae;
          --success-soft: #173d32;
          --warning: #ffc36a;
          --warning-soft: #493317;
          --code-bg: #090d14;
          --code-text: #e5e7eb;
          --shadow: 0 10px 30px rgb(0 0 0 / 24%);
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.65;
      }

      main {
        width: min(calc(100% - 32px), var(--content-width));
        margin: 0 auto;
        padding: 48px 0 80px;
      }

      header {
        margin-bottom: 32px;
      }

      section {
        margin-top: 40px;
        scroll-margin-top: 24px;
      }

      h1,
      h2,
      h3 {
        line-height: 1.2;
        text-wrap: balance;
      }

      h1 {
        margin: 4px 0 12px;
        font-size: clamp(2rem, 7vw, 3.75rem);
        letter-spacing: -0.04em;
      }

      h2 {
        margin: 0 0 16px;
        font-size: clamp(1.4rem, 4vw, 2rem);
        letter-spacing: -0.025em;
      }

      h3 {
        margin: 0 0 8px;
        font-size: 1.05rem;
      }

      p,
      ul,
      ol {
        margin-top: 0;
      }

      a {
        color: var(--accent);
      }

      code {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-alt);
        padding: 0.1em 0.35em;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.9em;
      }

      pre {
        overflow-x: auto;
        margin: 16px 0 0;
        border-radius: 10px;
        background: var(--code-bg);
        padding: 16px;
        color: var(--code-text);
      }

      pre code {
        border: 0;
        background: transparent;
        padding: 0;
        color: inherit;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 12px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .lede {
        max-width: 760px;
        margin-bottom: 20px;
        color: var(--muted);
        font-size: 1.1rem;
      }

      .muted {
        color: var(--muted);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: var(--accent-soft);
        padding: 4px 10px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .badge.success {
        background: var(--success-soft);
        color: var(--success);
      }

      .badge.warning {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .toc,
      .card,
      .callout {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .toc,
      .card {
        padding: 20px;
      }

      .toc ol {
        margin-bottom: 0;
        padding-left: 22px;
      }

      .grid {
        display: grid;
        grid-template-columns:
          repeat(auto-fit, minmax(min(240px, 100%), 1fr));
        gap: 16px;
      }

      .callout {
        border-left: 4px solid var(--accent);
        padding: 16px 18px;
      }

      .callout.warning {
        border-left-color: var(--warning);
        background: var(--warning-soft);
      }

      .steps {
        padding: 0;
        list-style: none;
        counter-reset: steps;
      }

      .steps > li {
        position: relative;
        margin-bottom: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 20px 20px 20px 64px;
        box-shadow: var(--shadow);
        counter-increment: steps;
      }

      .steps > li::before {
        position: absolute;
        top: 18px;
        left: 18px;
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--surface);
        content: counter(steps);
        font-size: 0.85rem;
        font-weight: 800;
      }

      .file-list,
      .checklist {
        padding-left: 0;
        list-style: none;
      }

      .file-list li,
      .checklist li {
        position: relative;
        margin: 8px 0;
        padding-left: 28px;
      }

      .file-list li::before {
        position: absolute;
        left: 0;
        content: "→";
        color: var(--accent);
        font-weight: 800;
      }

      .checklist li::before {
        position: absolute;
        left: 0;
        content: "□";
        color: var(--accent);
        font-weight: 800;
      }

      .section-number {
        color: var(--accent);
        font-size: 0.8em;
      }

      @media (max-width: 640px) {
        main {
          width: min(calc(100% - 20px), var(--content-width));
          padding-top: 28px;
        }

        section {
          margin-top: 32px;
        }

        .toc,
        .card {
          padding: 16px;
        }

        .steps > li {
          padding: 58px 16px 16px;
        }

        .steps > li::before {
          top: 16px;
          left: 16px;
        }

        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>

</html>
